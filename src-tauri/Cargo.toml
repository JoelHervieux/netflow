[package]
name = "netflow"
version = "2.0.0"
description = "NetFlow — client terminal SSH & Serial"
authors = ["NetFlow"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "netflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
russh = "0.45"
russh-keys = "0.45"
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "net", "sync", "macros", "time"] }
async-trait = "0.1"
serialport = "4.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
