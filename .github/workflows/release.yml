name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Stage installer asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/netflow.exe -Destination dist/NetFlow.exe -Force

      - name: Publish rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NetFlow (latest)
          body: |
            Build automatique depuis `main` au commit ${{ github.sha }}.
            Téléchargez **NetFlow.exe** ci-dessous.
          files: dist/NetFlow.exe
          make_latest: "true"
