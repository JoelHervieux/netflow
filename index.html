<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetFlow</title>
  </head>
  <body>
    <div id="app">
      <header class="titlebar" data-tauri-drag-region>
        <div class="logo">N</div>
        <div class="app-name">NetFlow</div>
        <div class="session-info" id="session-info"></div>
        <div class="title-actions" id="title-actions">
          <button class="title-action" id="btn-capture" title="Démarrer la capture (Ctrl+E)">
            <span class="cap-dot"></span><span id="cap-label">Capture</span>
          </button>
          <button class="title-action" id="btn-clear" title="Effacer l'écran (Ctrl+L)">Effacer</button>
        </div>
        <button class="title-action title-action-icon" id="btn-settings" title="Paramètres (Ctrl+,)">&#xE713;</button>
        <div class="caption-btns">
          <button class="caption-btn" id="btn-min" title="Réduire">&#xE921;</button>
          <button class="caption-btn" id="btn-max" title="Agrandir">&#xE922;</button>
          <button class="caption-btn caption-close" id="btn-close" title="Fermer">&#xE8BB;</button>
        </div>
      </header>

      <nav class="tabs" id="tabs"></nav>

      <main class="workspace" id="workspace">
        <section class="empty" id="empty">
          <div class="empty-mark">&gt;_</div>
          <div class="empty-title">NetFlow</div>
          <div class="empty-sub">Client terminal SSH &amp; série pour équipements réseau</div>
          <button class="bigbtn-primary" id="empty-new">
            <span class="bigbtn-plus">+</span>
            <span>Nouvelle connexion</span>
          </button>
          <div class="empty-shortcuts">
            <span><kbd>Ctrl</kbd>+<kbd>N</kbd> Nouvelle connexion</span>
            <span><kbd>Ctrl</kbd>+<kbd>,</kbd> Paramètres</span>
          </div>
        </section>
      </main>

      <footer class="statusbar" id="statusbar">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Aucune session active</span>
        <span class="status-hint" id="status-hint"></span>
        <span class="status-size" id="status-size"></span>
      </footer>
    </div>

    <div class="scrim" id="scrim"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
