<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NetFlow</title>
  </head>
  <body>
    <div id="app">
      <!-- Titlebar (custom, draggable) -->
      <header class="titlebar" data-tauri-drag-region>
        <div class="logo">N</div>
        <div class="app-name">NetFlow</div>
        <div class="session-info" id="session-info"></div>
        <div class="caption-btns">
          <button class="caption-btn" id="btn-min" title="Réduire">&#xE921;</button>
          <button class="caption-btn" id="btn-max" title="Agrandir">&#xE922;</button>
          <button class="caption-btn caption-close" id="btn-close" title="Fermer">&#xE8BB;</button>
        </div>
      </header>

      <!-- Tab bar -->
      <nav class="tabs" id="tabs"></nav>

      <!-- Workspace: one terminal panel per tab, plus empty state -->
      <main class="workspace" id="workspace">
        <section class="empty" id="empty">
          <div class="empty-mark">&gt;_</div>
          <div class="empty-title">NetFlow Terminal</div>
          <div class="empty-sub">Choisissez un type de connexion pour commencer</div>
          <div class="empty-btns">
            <button class="bigbtn bigbtn-ssh" id="empty-ssh">
              <span class="bigbtn-badge">SSH</span>
              <span class="bigbtn-body">
                <span class="bigbtn-title">Nouvelle connexion SSH</span>
                <span class="bigbtn-sub">Switch, routeur, serveur — port 22</span>
              </span>
              <span class="bigbtn-shortcut">Ctrl+N</span>
            </button>
            <button class="bigbtn bigbtn-com" id="empty-serial">
              <span class="bigbtn-badge bigbtn-badge-com">COM</span>
              <span class="bigbtn-body">
                <span class="bigbtn-title">Connexion série</span>
                <span class="bigbtn-sub">Console RJ45, USB-COM, port DB9</span>
              </span>
              <span class="bigbtn-shortcut">Ctrl+Shift+N</span>
            </button>
          </div>
        </section>
      </main>

      <!-- Status bar -->
      <footer class="statusbar" id="statusbar">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Aucune session active</span>
        <span class="status-hint" id="status-hint">Ctrl+N SSH&nbsp;&nbsp; Ctrl+Shift+N Serial</span>
        <span class="status-size" id="status-size"></span>
      </footer>
    </div>

    <!-- Modal host -->
    <div class="scrim" id="scrim"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
